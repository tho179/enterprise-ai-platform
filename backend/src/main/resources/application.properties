spring.application.name=enterprise-ai-platform

# ===============================
# DATABASE - PostgreSQL
# ===============================

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/enterprise_ai}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# ===============================
# JPA / HIBERNATE
# ===============================

# WARNING: ddl-auto=update is for DEVELOPMENT ONLY.
# Switch to 'validate' in production and use Flyway/Liquibase for migrations.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ===============================
# JWT
# ===============================

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}

# ===============================
# UPLOAD / AI PIPELINE
# ===============================

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB
app.upload-dir=${UPLOAD_DIR:./data/uploads}
app.ai-service-url=${AI_SERVICE_URL:http://127.0.0.1:8001}
app.ai-read-timeout-ms=${AI_READ_TIMEOUT_MS:600000}
app.ai-parse-timeout-ms=${AI_PARSE_TIMEOUT_MS:1800000}