spring.application.name=enterprise-ai-platform

# ===============================
# DATABASE - PostgreSQL
# ===============================

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/enterprise_ai}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# ===============================
# JPA / HIBERNATE
# ===============================

# Schema changes go through Flyway (db/migration); Hibernate only checks them.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ===============================
# FLYWAY
# ===============================

spring.flyway.enabled=true
# Databases created before Flyway already match V1, so they start from it.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# ===============================
# REDIS (AI gateway rate limit)
# ===============================

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_INTERNAL_PORT:6379}
spring.data.redis.timeout=1s

# ===============================
# ACTUATOR
# ===============================

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.redis.enabled=false

# ===============================
# JWT
# ===============================

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}

# ===============================
# UPLOAD / AI PIPELINE
# ===============================

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB
app.upload-dir=${UPLOAD_DIR:./data/uploads}
app.ai-service-url=${AI_SERVICE_URL:http://127.0.0.1:8001}
app.ai-read-timeout-ms=${AI_READ_TIMEOUT_MS:600000}
app.ai-parse-timeout-ms=${AI_PARSE_TIMEOUT_MS:1800000}
app.ai-internal-token=${INTERNAL_API_TOKEN:}
app.ai-chat-timeout-ms=${AI_CHAT_TIMEOUT_MS:180000}
app.ai-rate-limit-per-minute=${AI_RATE_LIMIT_PER_MINUTE:30}
